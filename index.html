  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html {
    background: #63e;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    position: relative;
    isolation: isolate;
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      max(12px, env(safe-area-inset-top))
      max(12px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom))
      max(12px, env(safe-area-inset-left));
  }

  /* Latar halaman: gradasi radial putih ke ungu, dipasang fixed agar tetap
     menutupi layar saat address bar HP muncul atau hilang. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(125% 125% at 50% 10%, #fff 40%, #63e 100%);
  }

  /* Kartu: langit malam dari video sebagai latar, diberi lapisan gelap
     agar teks tetap terbaca di HP. */
  .card {
    width: 100%;
    max-width: 460px;
    color: var(--text);
    background-color: #0c0a22;
    background-image:
      linear-gradient(180deg, rgba(10, 8, 30, .30) 0%, rgba(8, 6, 24, .62) 60%, rgba(6, 5, 20, .85) 100%),
      var(--card-sky);
    background-size: auto, cover;
    background-position: center, center top;
    background-repeat: no-repeat;
    border: 1px solid rgba(160, 150, 255, .35);
    border-radius: 24px;
    padding: clamp(18px, 5vw, 26px);
    box-shadow:
      0 0 0 1px rgba(120, 110, 255, .15),
      0 20px 50px rgba(20, 10, 60, .55),
      0 0 60px rgba(100, 90, 255, .35);
  }

  .hidden { display: none !important; }

  h1 {
    margin: 0 0 8px;
    text-align: center;
    color: #fff;
    font-size: clamp(24px, 7.5vw, 32px);
    line-height: 1.2;
    text-shadow: 0 0 18px var(--glow);
  }

  .sub {
    text-align: center;
    color: var(--text-soft);
    font-size: clamp(16px, 4.5vw, 18px);
    margin: 0 0 22px;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .6);
  }

  .top-row {
    font-weight: bold;
    color: var(--accent);
    font-size: 15px;
    margin-bottom: 8px;
    text-shadow: 0 0 10px rgba(0, 0, 0, .6);
  }

  .progress {
    height: 12px;
    background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(160, 150, 255, .25);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7c6cff, #e4e0ff);
    border-radius: 99px;
    box-shadow: 0 0 12px var(--glow);
    transition: width .35s ease;
  }

  .question {
    margin: 18px 0 8px;
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: clamp(20px, 6.2vw, 26px);
    font-weight: bold;
    color: #fff;
    line-height: 1.3;
    overflow-wrap: anywhere;
    text-shadow: 0 0 12px rgba(150, 140, 255, .85), 0 2px 6px rgba(0, 0, 0, .7);
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 56px;
    margin: 8px 0;
    padding: 10px 14px;
    border: 2px solid rgba(150, 140, 255, .40);
    border-radius: 16px;
    background: rgba(14, 11, 40, .62);
    font: inherit;
    font-size: clamp(16px, 4.8vw, 19px);
    color: var(--text);
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .1s, background .2s, border-color .2s, box-shadow .2s;
  }

  .opt:active { transform: scale(.98); }
  .opt:disabled { cursor: default; }

  .opt.selected {
    border-color: var(--accent);
    background: rgba(70, 58, 150, .6);
    box-shadow: 0 0 16px rgba(140, 130, 255, .55);
  }
  .opt.correct {
    border-color: #5ff0b0;
    background: rgba(18, 110, 84, .55);
    box-shadow: 0 0 16px rgba(95, 240, 176, .45);
  }
  .opt.wrong {
    border-color: #ff7a9a;
    background: rgba(120, 28, 58, .55);
    box-shadow: 0 0 16px rgba(255, 122, 154, .40);
  }

  .letter {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #8a7cff, #4b3fd0);
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    box-shadow: 0 0 10px rgba(130, 120, 255, .6);
  }

  .opt > span:last-child { overflow-wrap: anywhere; }

  .btn {
    display: block;
    width: 100%;
    min-height: 56px;
    margin-top: 12px;
    padding: 12px;
    border: none;
    border-radius: 16px;
    font: inherit;
    font-size: clamp(18px, 5.2vw, 21px);
    font-weight: bold;
    color: #fff;
    background: linear-gradient(90deg, #6c5cf0, #3f34b8);
    box-shadow: 0 0 22px rgba(120, 110, 255, .55), 0 6px 0 #241c70;
    text-shadow: 0 1px 4px rgba(0, 0, 0, .4);
    cursor: pointer;
    touch-action: manipulation;
  }

  .btn:active { transform: translateY(4px); box-shadow: 0 0 22px rgba(120, 110, 255, .55), 0 2px 0 #241c70; }

  .btn.secondary {
    background: rgba(255, 255, 255, .08);
    border: 2px solid rgba(180, 170, 255, .45);
    box-shadow: 0 0 14px rgba(120, 110, 255, .25), 0 6px 0 rgba(20, 14, 60, .9);
    color: var(--text);
  }
  .btn.secondary:active { box-shadow: 0 0 14px rgba(120, 110, 255, .25), 0 2px 0 rgba(20, 14, 60, .9); }

  #msg {
    min-height: 28px;
    margin-top: 10px;
    text-align: center;
    font-size: clamp(16px, 4.6vw, 19px);
    font-weight: bold;
    color: var(--text);
    text-shadow: 0 1px 8px rgba(0, 0, 0, .7);
  }

  .score {
    font-size: clamp(44px, 14vw, 56px);
    font-weight: bold;
    text-align: center;
    color: #fff;
    margin: 8px 0;
    text-shadow: 0 0 20px var(--glow);
  }

  #praise, #bye {
    text-align: center;
    font-size: clamp(16px, 4.6vw, 19px);
    color: var(--text-soft);
    margin: 8px 0;
    text-shadow: 0 1px 8px rgba(0, 0, 0, .7);
  }

  @media (max-width: 360px) {
    .opt { gap: 10px; padding: 10px 12px; }
    .letter { width: 32px; height: 32px; font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .opt, .btn, .bar { transition: none; }
  }
</style>
</head>
<body>

<div class="card">

  <section id="start">
    <h1>Kuis Seru!</h1>
    <p class="sub">10 soal mudah untuk diisi. Ayo kita coba!</p>
    <button class="btn" id="btn-start">Mulai</button>
  </section>

  <section id="quiz" class="hidden">
    <div class="top-row">
      <span id="progress-text"></span>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="question" id="question"></div>
    <div id="options"></div>

    <div id="msg"></div>
    <button class="btn" id="action">Jawab</button>
  </section>

  <section id="result" class="hidden">
    <h1>Selesai!</h1>
    <div class="score" id="score"></div>
    <p id="praise"></p>
    <button class="btn" id="btn-restart">Main Lagi</button>
    <button class="btn secondary" id="btn-exit">Selesai</button>
    <div id="bye"></div>
  </section>

</div>

<script>
  const QUESTIONS = [
    { question: "2 + 3 = ?",                       options: ["4", "5", "6"],                  correct: 1 },
    { question: "10 - 4 = ?",                      options: ["6", "5", "7"],                  correct: 0 },
    { question: "3 x 2 = ?",                       options: ["5", "9", "6"],                  correct: 2 },
    { question: "8 + 7 = ?",                       options: ["15", "14", "16"],               correct: 0 },
    { question: "Hewan apa yang bisa mengeong?",   options: ["Anjing", "Kucing", "Sapi"],     correct: 1 },
    { question: "Ada berapa hari dalam seminggu?", options: ["5", "10", "7"],                 correct: 2 },
    { question: "Matahari terbit dari arah mana?", options: ["Barat", "Timur", "Utara"],      correct: 1 },
    { question: "Hewan apa yang punya belalai?",   options: ["Kuda", "Gajah", "Ikan"],        correct: 1 },
    { question: "Ikan bernapas menggunakan...?",   options: ["Paru-paru", "Kulit", "Insang"], correct: 2 },
    { question: "Berapa kaki yang dimiliki seekor ayam?", options: ["2", "4", "6"],           correct: 0 },
  ];

  const LETTERS = ["A", "B", "C"];
  const $ = id => document.getElementById(id);

  let current = 0;
  let score = 0;
  let selected = -1;
  let answered = false;

  function showScreen(id) {
    ["start", "quiz", "result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  }

  function startQuiz() {
    current = 0;
    score = 0;
    showScreen("quiz");
    render();
  }

  function render() {
    const q = QUESTIONS[current];
    selected = -1;
    answered = false;

    $("progress-text").textContent = `Soal ${current + 1} dari ${QUESTIONS.length}`;
    $("bar").style.width = `${(current / QUESTIONS.length) * 100}%`;
    $("question").textContent = q.question;

    const box = $("options");
    box.innerHTML = "";
    q.options.forEach((text, i) => {
      const btn = document.createElement("button");
      btn.className = "opt";

      const letter = document.createElement("span");
      letter.className = "letter";
      letter.textContent = LETTERS[i];

      const label = document.createElement("span");
      label.textContent = text;

      btn.append(letter, label);
      btn.onclick = () => choose(i);
      box.appendChild(btn);
    });

    $("msg").textContent = "";
    $("action").textContent = "Jawab";
  }

  function choose(i) {
    if (answered) return;
    selected = i;
    [...$("options").children].forEach((b, j) => b.classList.toggle("selected", j === i));
  }

  function onAction() {
    if (answered) {
      current++;
      if (current >= QUESTIONS.length) finish();
      else render();
      return;
    }

    if (selected < 0) {
      $("msg").textContent = "Pilih jawabanmu dulu ya!";
      return;
    }

    answered = true;
    const q = QUESTIONS[current];
    [...$("options").children].forEach((b, j) => {
      b.disabled = true;
      b.classList.remove("selected");
      if (j === q.correct) b.classList.add("correct");
      else if (j === selected) b.classList.add("wrong");
    });

    if (selected === q.correct) {
      score++;
      $("msg").textContent = "Benar!";
    } else {
      $("msg").textContent = "Belum tepat, lihat jawaban yang hijau ya!";
    }

    $("bar").style.width = `${((current + 1) / QUESTIONS.length) * 100}%`;
    $("action").textContent = current + 1 < QUESTIONS.length ? "Lanjut" : "Lihat Hasil";
  }

  function finish() {
    showScreen("result");
    $("score").textContent = `${score} / ${QUESTIONS.length}`;

    let praise;
    if (score >= 9)      praise = "Hebat sekali! Kamu juara!";
    else if (score >= 6) praise = "Bagus sekali! Terus belajar ya!";
    else                 praise = "Ayo semangat lagi, kamu pasti bisa!";
    $("praise").textContent = praise;
    $("bye").textContent = "";
  }

  $("btn-start").onclick = startQuiz;
  $("btn-restart").onclick = startQuiz;
  $("action").onclick = onAction;
  $("btn-exit").onclick = () => {
    $("bye").textContent = "Terima kasih sudah bermain! Kamu boleh menutup tab ini.";
  };

  showScreen("start");
</script>
</body>
</html>
